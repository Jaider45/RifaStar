# Avisos y PRs automáticos de dependencias con vulnerabilidades o versiones nuevas
# (plan de seguridad, punto 11). Revisa cada PR antes de aceptarlo.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      menores: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /api
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      menores: { update-types: [minor, patch] }
  - package-ecosystem: docker
    directory: /api
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
