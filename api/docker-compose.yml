# Entorno de desarrollo de la API de Rifa Star.
#   docker compose up -d --build
#   docker compose run --rm api npx prisma migrate deploy   (lo hace el servicio migrate)
name: rifastar

x-api-env: &api-env
  NODE_ENV: development
  PORT: 3000
  CORS_ORIGINS: http://localhost:5173
  PUBLIC_BASE_URL: http://localhost:5173
  DATABASE_URL: postgresql://rifastar:rifastar@postgres:5432/rifastar
  APP_DATABASE_URL: postgresql://rifastar_app:rifastar_app@postgres:5432/rifastar
  SYSTEM_DATABASE_URL: postgresql://rifastar_system:rifastar_system@postgres:5432/rifastar
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: dev-access-secret-cambia-esto-en-produccion
  JWT_PARTICIPANT_SECRET: dev-participant-secret-cambia-esto-en-prod
  ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
  HASH_PEPPER: dev-pepper
  COOKIE_SECURE: "false"
  S3_ENDPOINT: http://s3:9000
  S3_PUBLIC_ENDPOINT: http://localhost:9000
  S3_BUCKET: rifastar
  S3_ACCESS_KEY: rifastar
  S3_SECRET_KEY: rifastar-secret
  S3_FORCE_PATH_STYLE: "true"
  MAIL_DRIVER: smtp
  SMTP_URL: smtp://mailpit:1025
  MESSAGING_DRIVER: fake
  BILLING_DRIVER: fake
  LOG_LEVEL: info

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rifastar
      POSTGRES_PASSWORD: rifastar
      POSTGRES_DB: rifastar
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rifastar"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  # Almacenamiento compatible con S3 para desarrollo (SeaweedFS; MinIO ya no publica imágenes).
  # En producción se usa Cloudflare R2 u otro S3: la API habla el mismo protocolo.
  s3:
    image: chrislusf/seaweedfs:3.80
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo '{"identities":[{"name":"rifastar","credentials":[{"accessKey":"rifastar","secretKey":"rifastar-secret"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > /etc/s3.json
        exec weed server -dir=/data -ip=s3 -ip.bind=0.0.0.0 -volume.max=0 -master.volumeSizeLimitMB=512 \
          -s3 -s3.port=9000 -s3.config=/etc/s3.json
    ports: ["9000:9000"]
    volumes: [s3data:/data]

  # Crea el bucket privado «rifastar» (idempotente).
  s3-setup:
    image: chrislusf/seaweedfs:3.80
    depends_on: [s3]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 60); do
          echo "s3.bucket.create -name rifastar" | weed shell -master=s3:9333 >/dev/null 2>&1
          if echo "s3.bucket.list" | weed shell -master=s3:9333 2>/dev/null | grep -q rifastar; then echo "bucket rifastar listo"; exit 0; fi
          sleep 2
        done
        echo "no se pudo crear el bucket"; exit 1

  mailpit:
    image: axllent/mailpit:v1.20
    ports: ["8025:8025", "1025:1025"]

  # Usa la etapa de build (tiene tsx) para migrar y sembrar datos de desarrollo.
  migrate:
    build: { context: ., target: dev }
    environment: *api-env
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: .
    environment: *api-env
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: .
    environment: *api-env
    command: ["node", "dist/worker.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  s3data:
